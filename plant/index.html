  <div class="plant-shell">
    <div id="plant-noscript" class="plant-noscript">
      Heuvelland plant HMI needs JavaScript for the live tag scan.
    </div>

    <div id="plant-app" class="plant-hmi" hidden>
      <header class="plant-hmi__header">
        <div class="plant-hmi__title">
          <h1>Heuvelland · Line 3</h1>
          <span class="plant-sim-badge" title="Simulated demoware — not a live plant">SIM</span>
        </div>
        <nav class="plant-area-nav" role="tablist" aria-label="Plant areas">
          <button type="button" class="plant-area-nav__btn" role="tab" data-drawing="mixing" aria-selected="false">Mixing</button>
          <button type="button" class="plant-area-nav__btn" role="tab" data-drawing="refining" aria-selected="false">Refining</button>
          <button type="button" class="plant-area-nav__btn" role="tab" data-drawing="conching" aria-selected="false">Conching</button>
          <button type="button" class="plant-area-nav__btn" role="tab" data-drawing="tempering" aria-selected="false">Tempering</button>
          <button type="button" class="plant-area-nav__btn" role="tab" data-drawing="moulding" aria-selected="false">Moulding</button>
          <button type="button" class="plant-area-nav__btn is-active" role="tab" data-drawing="packaging" aria-selected="true">Packaging</button>
        </nav>
        <div class="plant-hmi__meta">
          <span class="plant-q-legend" aria-label="Quality legend">
            <span><i class="plant-q-dot plant-q-dot--good" aria-hidden="true"></i>Good</span>
            <span><i class="plant-q-dot plant-q-dot--uncertain" aria-hidden="true"></i>Uncertain</span>
            <span><i class="plant-q-dot plant-q-dot--bad" aria-hidden="true"></i>Bad</span>
            <span><i class="plant-q-dot plant-q-dot--stale" aria-hidden="true"></i>Stale</span>
          </span>
          <span class="plant-scan">
            <span id="plant-scan-dot" class="plant-scan__dot" aria-hidden="true"></span>
            <span id="plant-scan-label">Scanning</span>
          </span>
          <span id="plant-clock" aria-live="off">--:--:--</span>
        </div>
      </header>

      <div class="plant-body">
        <!-- Tag browser -->
        <aside class="plant-pane plant-pane--tree" aria-label="Tag browser">
          <div class="plant-pane__head">
            <span>Tag browser</span>
            <span id="plant-tree-path" class="text-slate-600">[edge]Heuvelland</span>
          </div>
          <div class="plant-pane__body">
            <ul id="plant-tree" class="plant-tree"></ul>
          </div>
        </aside>

        <!-- Mimic -->
        <section class="plant-pane plant-mimic" aria-label="Line P and ID">
          <div class="plant-toolbar" role="toolbar" aria-label="Operator actions">
            <div class="plant-toolbar__group" data-toolbar-area="packaging" role="group" aria-label="Packaging scenarios">
              <span class="plant-toolbar__label">Scenario</span>
              <button type="button" class="plant-btn plant-btn--jam" data-scenario="jam" title="Cartoner jam fault">Jam</button>
              <button type="button" class="plant-btn plant-btn--starved" data-scenario="starved" title="Infeed starved">Starved</button>
              <button type="button" class="plant-btn plant-btn--recover" data-scenario="recover" title="Return packaging line to healthy AUTO">Recover</button>
            </div>
            <div class="plant-toolbar__group" data-toolbar-area="mixing" role="group" aria-label="Mixing scenarios" hidden>
              <span class="plant-toolbar__label">Scenario</span>
              <button type="button" class="plant-btn plant-btn--jam" data-mix-scenario="overtemp" title="Jacket overtemperature">Overtemp</button>
              <button type="button" class="plant-btn plant-btn--starved" data-mix-scenario="valve" title="Cocoa liquor valve stuck closed">Valve fault</button>
              <button type="button" class="plant-btn plant-btn--recover" data-mix-scenario="recover" title="Clear mixing faults">Recover</button>
            </div>
            <div class="plant-toolbar__group" data-toolbar-area="tempering" role="group" aria-label="Tempering scenarios" hidden>
              <span class="plant-toolbar__label">Scenario</span>
              <button type="button" class="plant-btn plant-btn--jam" data-temper-scenario="warm" title="Cooling zones too warm">Zone warm</button>
              <button type="button" class="plant-btn plant-btn--starved" data-temper-scenario="belt" title="Temper belt stopped">Belt stop</button>
              <button type="button" class="plant-btn plant-btn--recover" data-temper-scenario="recover" title="Clear tempering faults">Recover</button>
            </div>
            <span class="plant-toolbar__sep" aria-hidden="true"></span>
            <button type="button" class="plant-btn" data-action="ack-all">Ack all</button>
            <button type="button" class="plant-btn" data-action="reset-reject" data-toolbar-packaging-only>Reset reject</button>
            <button type="button" class="plant-btn" data-action="clear-jam" data-toolbar-packaging-only>Clear cartoner jam</button>
            <span class="plant-toolbar__sep" aria-hidden="true"></span>
            <button type="button" class="plant-btn plant-btn--ghost" data-action="reset-line">Reset line</button>
          </div>

          <div class="plant-mimic__canvas">
            <div class="plant-status" aria-label="Line status">
              <span class="plant-status__item"><span id="kpi-a-label">OEE</span> <strong id="kpi-a">—</strong></span>
              <span class="plant-status__sep" aria-hidden="true">·</span>
              <span class="plant-status__item"><span id="kpi-b-label">Thru</span> <strong id="kpi-b">—</strong></span>
              <span class="plant-status__sep" aria-hidden="true">·</span>
              <span class="plant-status__item"><span id="kpi-c-label">Mode</span> <strong id="kpi-c">—</strong></span>
              <span class="plant-status__sep" aria-hidden="true">·</span>
              <span class="plant-status__item"><span id="kpi-d-label">Rejects</span> <strong id="kpi-d">—</strong></span>
            </div>

            <div id="plant-pid" class="plant-pid" aria-label="Process P and ID"></div>
          </div>

          <div id="plant-detail" class="plant-detail" aria-live="polite"></div>
        </section>

        <!-- Alarms -->
        <aside class="plant-pane plant-pane--alarms" aria-label="Alarm list">
          <div class="plant-pane__head">
            <span>Alarms</span>
            <span class="plant-alarm-count"><span id="plant-alarm-count">0</span> active</span>
          </div>
          <div class="plant-pane__body">
            <ul id="plant-alarms" class="plant-alarms"></ul>
          </div>
        </aside>
      </div>
    </div>
  </div>

<!-- partial:plant-scripts -->

<!-- /partial:plant-scripts -->
