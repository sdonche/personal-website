  <!-- TOP BAR — logo + desk nav / floor status + mode switch + mobile actions -->
  <header class="fixed top-0 inset-x-0 z-40 px-4 sm:px-6 backdrop-blur-md bg-slate-950/60 border-b border-slate-800/60">
    <div class="max-w-5xl mx-auto h-14 flex items-center justify-between gap-3">
      <a href="#hero" class="flex items-center gap-2 group shrink-0">
        <span class="relative inline-flex h-2.5 w-2.5">
          <span class="absolute inset-0 rounded-full bg-accent animate-ping opacity-60"></span>
          <span class="relative rounded-full h-2.5 w-2.5 bg-accent"></span>
        </span>
        <span class="brand-mark brand-mark--floor font-mono text-xs sm:text-sm tracking-wider text-slate-300 group-hover:text-brand-300 transition-colors">
          sam.donche<span class="brand-mark__host"><span class="text-brand-400">@</span>edge</span>
        </span>
        <span class="brand-mark brand-mark--desk text-sm sm:text-base font-semibold tracking-tight text-slate-100 group-hover:text-brand-300 transition-colors">
          Sam Donche
        </span>
      </a>

      <nav class="desk-nav hidden md:flex items-center gap-5 text-sm text-slate-400" aria-label="Primary">
        <a href="#about" class="hover:text-brand-300 transition-colors">About</a>
        <a href="#experience" class="hover:text-brand-300 transition-colors">Experience</a>
        <a href="#work" class="hover:text-brand-300 transition-colors">Work</a>
        <a href="#contact" class="hover:text-brand-300 transition-colors">Contact</a>
      </nav>

      <div class="flex items-center gap-1.5 sm:gap-3 ml-auto min-w-0">
        <!-- Floor-only: green dot always; "Online" label from sm up (saves bar space on phones) -->
        <div class="floor-status flex items-center gap-2 sm:gap-4 shrink-0">
          <span id="sys-status" class="flex items-center gap-1.5 font-mono text-[11px] uppercase tracking-widest text-slate-400 cursor-pointer" title="Telemetry">
            <span class="h-1.5 w-1.5 rounded-full bg-accent shrink-0" aria-hidden="true"></span>
            <span class="floor-status__label"><span class="hidden sm:inline">System:&nbsp;</span>Online</span>
          </span>
          <span aria-hidden="true" class="hidden sm:inline text-slate-700 font-mono text-[11px]">|</span>
          <span id="local-time" class="hidden sm:inline font-mono text-[11px] uppercase tracking-widest text-slate-400" aria-live="off">--:--:--</span>
        </div>

        <div class="mode-switch shrink-0" role="group" aria-label="Presentation mode">
          <button type="button" class="mode-switch__btn" data-mode-set="desk" aria-pressed="true">Desk</button>
          <button type="button" class="mode-switch__btn" data-mode-set="floor" aria-pressed="false">Floor</button>
        </div>

        <!-- Mobile/tablet: open command palette without a keyboard -->
        <button
          id="cmdk-open-bar"
          type="button"
          class="lg:hidden inline-flex items-center justify-center h-10 w-10 rounded-md border border-slate-700 text-brand-300 hover:bg-slate-800/60 hover:border-brand-400/50 transition"
          aria-label="Open tag search"
          data-cmdk-open
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true">
            <circle cx="11" cy="11" r="6"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/>
          </svg>
        </button>

        <!-- Mobile-only: open tag-browser sidebar overlay -->
        <button
          id="nav-toggle"
          type="button"
          class="lg:hidden inline-flex items-center justify-center h-10 w-10 rounded-md border border-slate-700 text-brand-300 hover:bg-slate-800/60 hover:border-brand-400/50 transition"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="tag-nav"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
