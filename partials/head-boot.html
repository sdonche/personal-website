  <script>
    document.documentElement.classList.add('js');
    try {
      if (localStorage.getItem('samdonche.nav.rail') === '1') {
        document.documentElement.classList.add('nav-rail');
      }
      var params = new URLSearchParams(location.search);
      var mode = params.get('mode');
      // Canonical: desk | floor. Legacy: site/briefing → desk, operator → floor.
      if (mode === 'briefing' || mode === 'site') mode = 'desk';
      if (mode === 'operator') mode = 'floor';
      if (mode === 'desk' || mode === 'floor') {
        localStorage.setItem('samdonche.mode', mode);
      } else {
        mode = localStorage.getItem('samdonche.mode');
        if (mode === 'briefing' || mode === 'site') mode = 'desk';
        if (mode === 'operator') mode = 'floor';
      }
      if (mode !== 'floor') mode = 'desk';
      document.documentElement.setAttribute('data-mode', mode);
    } catch (e) {
      document.documentElement.setAttribute('data-mode', 'desk');
    }
  </script>
