name: Check

on:
  push:
  pull_request:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `make sitemap` lastmod (git log) stays stable in CI.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Expand partials, stamp asset hashes, verify skills + chrome sync.
      - name: Run make
        run: make

      # Hostinger serves the committed HTML. If `make` rewrote anything, the
      # working tree is dirty — the rendered chrome wasn't committed.
      - name: Ensure generated HTML is committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Working tree dirty after \`make\`. Run \`make\` locally and commit the result."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "OK: committed HTML matches partials + asset hashes."

  smoke:
    name: plant smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No package.json on purpose (the site has no build step): install the
      # test runner for this job only.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # Every drawing, a fault → recovery cycle, a setpoint write, and the
      # plant deep links used by the notes and the case study.
      - name: Run plant smoke test
        run: make smoke
